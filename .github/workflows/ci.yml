name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # テストを動かし、計算の分岐の網羅率が下限を割っていないかも調べる（docs/verification.md）
      - run: npm run coverage
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
